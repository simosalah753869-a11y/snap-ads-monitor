name: Snapchat & TikTok Ads 24/7 Monitor

on:
  schedule:
    - cron: "*/20 * * * *"  # يعمل تلقائياً كل 20 دقيقة على مدار الـ 24 ساعة
  workflow_dispatch:        # يتيح لك تشغيله يدوياً بزر واحد من GitHub في أي وقت

concurrency:
  group: snap-tiktok-ads-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Create snap_config.json
        env:
          SNAP_CLIENT_ID: ${{ vars.SNAP_CLIENT_ID || secrets.SNAP_CLIENT_ID }}
          SNAP_CLIENT_SECRET: ${{ vars.SNAP_CLIENT_SECRET || secrets.SNAP_CLIENT_SECRET }}
          SNAP_REFRESH_TOKEN: ${{ vars.SNAP_REFRESH_TOKEN || secrets.SNAP_REFRESH_TOKEN }}
        run: |
          python -c "import json, os; open('snap_config.json', 'w').write(json.dumps({'client_id': os.environ['SNAP_CLIENT_ID'], 'client_secret': os.environ['SNAP_CLIENT_SECRET'], 'refresh_token': os.environ['SNAP_REFRESH_TOKEN']}))"

      - name: Run Snapchat Automation Rules
        continue-on-error: true
        run: python snap_monitor.py

      - name: Run TikTok Smart+ Automation Rules (All 6 Accounts)
        continue-on-error: true
        env:
          TIKTOK_COOKIES_JSON: ${{ vars.TIKTOK_COOKIES_JSON || secrets.TIKTOK_COOKIES_JSON }}
        run: python tiktok_monitor.py

      - name: Run Combined Cross-Platform Monitor (Maybach & TIME X)
        continue-on-error: true
        env:
          TIKTOK_COOKIES_JSON: ${{ vars.TIKTOK_COOKIES_JSON || secrets.TIKTOK_COOKIES_JSON }}
        run: python cross_product_monitor.py

      - name: Save paused_history.json (لتذكر ما تم إيقافه وعدم إيقاف ما تعيد تشغيله)
        continue-on-error: true
        run: |
          cp paused_history.json /tmp/paused_history_run.json
          git config user.name "SnapTikTokAdsBot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python -c "
          import json
          from pathlib import Path
          p_rem = Path('paused_history.json')
          p_run = Path('/tmp/paused_history_run.json')
          rem = json.loads(p_rem.read_text('utf-8')) if p_rem.exists() else {}
          run = json.loads(p_run.read_text('utf-8')) if p_run.exists() else {}
          for k, v in run.items():
              if isinstance(v, dict) and isinstance(rem.get(k), dict):
                  merged = dict(rem[k])
                  merged.update(v)
                  rem[k] = merged
              else:
                  rem[k] = v
          p_rem.write_text(json.dumps(rem, ensure_ascii=False, indent=2), 'utf-8')
          "
          git add paused_history.json
          git diff --staged --quiet || (git commit -m "Update paused_history.json [skip ci]" && git push origin main || true)
