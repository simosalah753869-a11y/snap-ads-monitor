name: Snapchat, TikTok & Facebook Ads 24/7 Monitor

on:
  schedule:
    - cron: "*/20 * * * *"  # يعمل تلقائياً كل 20 دقيقة على مدار الـ 24 ساعة
  workflow_dispatch:        # يتيح لك تشغيله يدوياً بزر واحد من GitHub في أي وقت

concurrency:
  group: snap-tiktok-ads-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Create snap_config.json & snap_config_daralrimal.json (All 8 Snapchat Accounts Across Both Orgs)
        env:
          SNAP_CLIENT_ID: ${{ vars.SNAP_CLIENT_ID || secrets.SNAP_CLIENT_ID }}
          SNAP_CLIENT_SECRET: ${{ vars.SNAP_CLIENT_SECRET || secrets.SNAP_CLIENT_SECRET }}
          SNAP_REFRESH_TOKEN: ${{ vars.SNAP_REFRESH_TOKEN || secrets.SNAP_REFRESH_TOKEN }}
          SNAP_DARALRIMAL_REFRESH_TOKEN: ${{ vars.SNAP_DARALRIMAL_REFRESH_TOKEN || secrets.SNAP_DARALRIMAL_REFRESH_TOKEN }}
        run: |
          python -c "import json, os; dar_rt = os.environ.get('SNAP_DARALRIMAL_REFRESH_TOKEN', ''); cfg = {'client_id': os.environ['SNAP_CLIENT_ID'], 'client_secret': os.environ['SNAP_CLIENT_SECRET'], 'refresh_token': os.environ['SNAP_REFRESH_TOKEN'], 'daralrimal_account': {'ad_account_id': 'c6447397-25a3-418a-8529-422581e1bbe0', 'pixel_id': '17658288-4114-4eb3-afc9-62da64437fee', 'refresh_token': dar_rt}}; open('snap_config.json', 'w').write(json.dumps(cfg)); open('snap_config_daralrimal.json', 'w').write(json.dumps({'client_id': os.environ['SNAP_CLIENT_ID'], 'client_secret': os.environ['SNAP_CLIENT_SECRET'], 'refresh_token': dar_rt})) if dar_rt else None"

      - name: Run Snapchat Automation Rules (Pause Violating Campaigns/AdSquads/Videos Only — ZERO Bid Changes)
        continue-on-error: true
        env:
          STOP_LOSS_PAUSE_ONLY: "1"
        run: |
          python snap_monitor.py

      - name: Run TikTok Smart+ Automation Rules (All 6 Accounts — Pause Violating Campaigns/Videos Only)
        continue-on-error: true
        env:
          STOP_LOSS_PAUSE_ONLY: "1"
          TIKTOK_COOKIES_JSON: ${{ vars.TIKTOK_COOKIES_JSON || secrets.TIKTOK_COOKIES_JSON }}
        run: python tiktok_monitor.py

      - name: Run Facebook Ads 24/7 Automation Rules (All 3 Ad Accounts — Pause Violating Campaigns/Ads Only)
        continue-on-error: true
        env:
          STOP_LOSS_PAUSE_ONLY: "1"
          FB_COOKIE_STR: ${{ vars.FB_COOKIE_STR || secrets.FB_COOKIE_STR }}
          FB_PROXY_AUTH: ${{ vars.FB_PROXY_AUTH || secrets.FB_PROXY_AUTH }}
          FB_ACCESS_TOKEN: ${{ vars.FB_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
        run: python facebook_monitor.py

      - name: Run Combined Cross-Platform Monitor (Maybach & TIME X & Taager Tests)
        continue-on-error: true
        env:
          STOP_LOSS_PAUSE_ONLY: "1"
          TIKTOK_COOKIES_JSON: ${{ vars.TIKTOK_COOKIES_JSON || secrets.TIKTOK_COOKIES_JSON }}
        run: python cross_product_monitor.py

      - name: Run 24/7 Cloud Quant Trading Guardian (5m OCO Replay + Crypto/Gold/US Stocks Execution While Laptop is Off)
        continue-on-error: true
        run: python binance_guardian_bot.py

      - name: Save paused_history.json, Gulf ledger & Quant Portfolio (لتذكر ما تم إيقافه وتحديث محفظة التداول في السحابة واللابتوب طافي)
        continue-on-error: true
        run: |
          cp paused_history.json /tmp/paused_history_run.json
          if [ -f gulf_2h_actions_ledger.json ]; then cp gulf_2h_actions_ledger.json /tmp/gulf_2h_actions_ledger_run.json; fi
          if [ -f binance_paper_portfolio.json ]; then cp binance_paper_portfolio.json /tmp/binance_paper_portfolio_run.json; fi
          git config user.name "SnapTikTokAdsBot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python -c "
          import json
          from pathlib import Path
          p_rem = Path('paused_history.json')
          p_run = Path('/tmp/paused_history_run.json')
          rem = json.loads(p_rem.read_text('utf-8')) if p_rem.exists() else {}
          run = json.loads(p_run.read_text('utf-8')) if p_run.exists() else {}
          for k, v in run.items():
              if isinstance(v, dict) and isinstance(rem.get(k), dict):
                  merged = dict(rem[k])
                  merged.update(v)
                  rem[k] = merged
              else:
                  rem[k] = v
          p_rem.write_text(json.dumps(rem, ensure_ascii=False, indent=2), 'utf-8')
          g_rem = Path('gulf_2h_actions_ledger.json')
          g_run = Path('/tmp/gulf_2h_actions_ledger_run.json')
          if g_run.exists():
              gr = json.loads(g_rem.read_text('utf-8')) if g_rem.exists() else {}
              gu = json.loads(g_run.read_text('utf-8'))
              for dk in ('snap_squad_bumps', 'tiktok_gulf_scaled'):
                  m_d = dict(gr.get(dk) or {})
                  m_d.update(gu.get(dk) or {})
                  gr[dk] = m_d
              logs = list(gr.get('big_actions_log') or []) + [x for x in (gu.get('big_actions_log') or []) if x not in (gr.get('big_actions_log') or [])]
              gr['big_actions_log'] = logs[-60:]
              g_rem.write_text(json.dumps(gr, ensure_ascii=False, indent=2), 'utf-8')
          q_rem = Path('binance_paper_portfolio.json')
          q_run = Path('/tmp/binance_paper_portfolio_run.json')
          if q_run.exists():
              qr = json.loads(q_rem.read_text('utf-8')) if q_rem.exists() else {}
              qu = json.loads(q_run.read_text('utf-8'))
              if str(qu.get('last_updated_utc') or '') >= str(qr.get('last_updated_utc') or ''):
                  q_rem.write_text(json.dumps(qu, ensure_ascii=False, indent=2), 'utf-8')
          "
          git add paused_history.json
          if [ -f gulf_2h_actions_ledger.json ]; then git add gulf_2h_actions_ledger.json; fi
          if [ -f binance_paper_portfolio.json ]; then git add binance_paper_portfolio.json; fi
          git diff --staged --quiet || (git commit -m "Update paused_history, gulf_ledger & quant_portfolio [skip ci]" && git push origin main || true)
