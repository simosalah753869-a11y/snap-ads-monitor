name: Snapchat & TikTok Ads 24/7 Monitor

on:
  schedule:
    - cron: "*/20 * * * *"  # يعمل تلقائياً كل 20 دقيقة على مدار الـ 24 ساعة
  workflow_dispatch:        # يتيح لك تشغيله يدوياً بزر واحد من GitHub في أي وقت

permissions:
  contents: write

concurrency:
  group: snap-tiktok-ads-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Create snap_config.json
        env:
          SNAP_CLIENT_ID: ${{ vars.SNAP_CLIENT_ID || secrets.SNAP_CLIENT_ID }}
          SNAP_CLIENT_SECRET: ${{ vars.SNAP_CLIENT_SECRET || secrets.SNAP_CLIENT_SECRET }}
          SNAP_REFRESH_TOKEN: ${{ vars.SNAP_REFRESH_TOKEN || secrets.SNAP_REFRESH_TOKEN }}
        run: |
          python -c "import json, os; open('snap_config.json', 'w').write(json.dumps({'client_id': os.environ['SNAP_CLIENT_ID'], 'client_secret': os.environ['SNAP_CLIENT_SECRET'], 'refresh_token': os.environ['SNAP_REFRESH_TOKEN']}))"

      - name: Run Snapchat Automation Rules
        continue-on-error: true
        run: python snap_monitor.py

      - name: Run Snapchat Auto-Duplication (Top-Up Active AdSquads to 20)
        continue-on-error: true
        run: python topup_car_campaigns.py

      - name: Run TikTok Smart+ Automation Rules (All 6 Accounts)
        continue-on-error: true
        env:
          TIKTOK_COOKIES_JSON: ${{ vars.TIKTOK_COOKIES_JSON || secrets.TIKTOK_COOKIES_JSON }}
        run: python tiktok_monitor.py

      - name: Save paused_history.json
        run: |
          git config user.name "SnapTikTokAdsBot"
          git config user.email "bot@users.noreply.github.com"
          git add paused_history.json
          if ! git diff --staged --quiet; then
            git commit -m "Update paused_history.json [skip ci]"
            git pull --rebase -X theirs origin main || true
            git push || true
          fi

